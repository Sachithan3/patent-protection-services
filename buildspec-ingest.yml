version: 0.2

# One-shot ingestion: downloads the patent CSV from S3, computes embeddings,
# and bulk-inserts the records into RDS PostgreSQL + pgvector.
#
# Run from an environment with network access to the RDS endpoint on 5432
# (CodeBuild, ECS, or a machine inside the VPC).

phases:
  install:
    runtime-versions:
      python: '3.11'
    commands:
      - 'python -m pip install --upgrade pip'
      - 'pip install -r requirements.txt'

  build:
    commands:
      - 'export PYTHONPATH=$PWD'
      - 'python aws/ingest_data.py'
